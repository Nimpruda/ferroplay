<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust video player</title>
<link rel="stylesheet" href="player.css">
<style>
  body { margin: 0 auto; padding: 24px 16px; max-width: 760px; font: 15px/1.5 system-ui, sans-serif; background: #111; color: #ddd; }
  .vp { width: 100%; aspect-ratio: 16 / 9; margin: 12px 0; }
  form { display: flex; gap: 8px; }
  input[type=url] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #444; border-radius: 6px; background: #1b1b1b; color: inherit; font: inherit; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: #4af; color: #000; font: inherit; cursor: pointer; }
  fieldset { border: 1px solid #333; border-radius: 6px; display: grid; gap: 4px; }
  a { color: #8bf; }
  kbd { background: #222; padding: 1px 5px; border-radius: 3px; }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .samples button { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
</style>

<h1>Rust + WASM video player</h1>
<form id="open">
  <input name="play" type="url" placeholder="Paste a video link (.mp4 or .m3u8)" required>
  <button>Play</button>
</form>
<div class="samples" id="samples" aria-label="Test media"></div>
<video id="main" playsinline></video>
<fieldset id="plugins"><legend>Plugins</legend></fieldset>
<p><small>Keys (click the player first): <kbd>space</kbd> play, <kbd>←</kbd><kbd>→</kbd> ±5 s, <kbd>j</kbd><kbd>l</kbd> ±10 s,
  <kbd>↑</kbd><kbd>↓</kbd> volume, <kbd>m</kbd> mute, <kbd>f</kbd> fullscreen, <kbd>0</kbd>–<kbd>9</kbd> jump, <kbd>&lt;</kbd><kbd>&gt;</kbd> speed.
  The link and plugins live in the page URL, so a setup can be shared.
  Default video: Sintel trailer © Blender Foundation, <a href="https://www.blender.org">blender.org</a>, CC-BY 3.0.</small></p>

<script type="module">
  import { init, player } from './player.js';
  import { speed } from './plugins/speed.js';
  import { hls } from './plugins/hls.js';

  // name: [what the player gets (a number for Rust plugins, a function for JS ones), label]
  const PLUGINS = {
    keyboard: [5, 'Keyboard shortcuts (Rust)'],
    hls: [hls, 'HLS: Rust engine where the browser has none (Rust + JS)'],
    speed: [speed, 'Speed button (JS)'],
    abLoop: [1, 'A-B loop: a marks a start, b an end, b again stops (Rust)'],
    loop: [1, 'Start over at the end (Rust)'],
    startAt: [20, 'Start at 0:20 (Rust)'],
  };
  const params = new URLSearchParams(location.search);
  let link = params.get('play') || 'hls/master.m3u8';
  let chosen = (params.get('plugins') ?? 'keyboard,hls,speed').split(',').filter(name => name in PLUGINS);

  const video = document.getElementById('main');
  const form = document.getElementById('open');
  const box = document.getElementById('plugins');
  let p, resume;

  // Other sites' playlists go through the server's proxy, so they play without CORS headers.
  const source = url => {
    const u = new URL(url, location.href);
    return u.origin !== location.origin && /\.m3u8$/i.test(u.pathname) ? `/proxy/${u.href}` : u.href;
  };
  const remember = () => history.replaceState(null, '', '?' + new URLSearchParams({ play: link, plugins: chosen }));
  const forget = () => video.removeEventListener('loadedmetadata', resume);

  // A new set of plugins means a new player. Same video and position; HLS reloads, so seek back.
  function build() {
    const [time, playing] = [video.currentTime, !video.paused];
    forget();
    p?.destroy();
    p = player(video, Object.fromEntries(chosen.map(name => [name, PLUGINS[name][0]])));
    p.load(source(link));
    resume = () => p.send('seek', time);
    if (time) video.addEventListener('loadedmetadata', resume, { once: true });
    if (playing) p.play();
  }

  for (const [name, [, label]] of Object.entries(PLUGINS)) {
    box.insertAdjacentHTML('beforeend', `<label><input type="checkbox" name="${name}"> ${label}</label>`);
    box.querySelector(`[name=${name}]`).checked = chosen.includes(name);
  }
  box.addEventListener('change', () => {
    chosen = [...box.querySelectorAll(':checked')].map(input => input.name);
    remember();
    build();
  });
  // Plays `url` now: from the form, or from a test button.
  function openLink(url) {
    link = url;
    form.play.value = url;
    remember();
    forget();
    p.play(source(link));
  }
  form.addEventListener('submit', e => {
    e.preventDefault();
    openLink(form.play.value);
  });

  // Test media for manual checks. Local files come from web/ (see make-hls.sh and make-media.sh);
  // the other-origin button plays the local HLS from localhost, so it goes through the proxy.
  // The live one needs make-live.sh running (it writes web/hls/live/).
  const here = location.origin;
  const elsewhere = here.replace('127.0.0.1', 'localhost');
  const SAMPLES = [
    ['HLS, local (Sintel, 3 qualities)', `${here}/hls/master.m3u8`],
    ['MP4, local (test pattern, 20 s)', `${here}/media/test.mp4`],
    ['HLS, other origin (via proxy)', `${elsewhere}/hls/master.m3u8`],
    ['HLS, live (run ./make-live.sh first)', `${here}/hls/live/live.m3u8`],
    ['MP4, blender.org (Sintel trailer)', 'https://download.blender.org/durian/trailer/sintel_trailer-480p.mp4'],
  ];
  const samples = document.getElementById('samples');
  for (const [label, url] of SAMPLES) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => openLink(url));
    samples.append(button);
  }

  await init();
  form.play.value = params.get('play') ?? '';
  build();
  if (params.has('play')) p.play();
</script>
</html>
