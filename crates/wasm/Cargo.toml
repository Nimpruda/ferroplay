[package]
name = "player-wasm"
description = "The browser build: the player and its plugins behind the interface web/player.js uses."
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
player.workspace = true
hls = { workspace = true, optional = true }

[target.wasm32-unknown-unknown.dependencies]
dlmalloc = { version = "0.2.14", features = ["global"] }

# `--no-default-features` builds web/player-core.wasm: the core and its intent-only plugins, for pages without HLS.
[features]
default = ["hls"]
hls = ["dep:hls"]
