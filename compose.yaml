# Dev stack: `just up` (server + demo media), `just up-live` adds a live stream. See the justfile.
# Generated media lands in the repo's web/hls and web/catalog, shared with the native workflow.

x-media: &media
  build: { context: ., target: media }
  image: player-media
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}" # files on the host stay yours
  volumes: [./web:/src/web, ./.cache:/src/.cache] # .cache: downloads kept between runs

services:
  server:
    build: { context: ., target: server }
    image: player-server
    # Localhost only: the proxy fetches any URL it is given.
    ports: ["127.0.0.1:${PORT:-8080}:8080"]
    volumes:
      - ./web/hls:/app/web/hls:ro
      - ./web/catalog:/app/web/catalog:ro
    depends_on:
      media: { condition: service_completed_successfully }

  # One-shot: makes the demo media that is missing, like build.sh.
  media:
    <<: *media
    command: ./make-demo.sh

  # web/hls/live/live.m3u8 until stopped; stopping ends the playlist (see make-live.sh).
  live:
    <<: *media
    command: ./make-live.sh
    init: true
    profiles: [live]

  # e2e/run.py in headless Firefox and Chrome, with its own server inside the container.
  e2e:
    build: { context: ., target: e2e }
    image: player-e2e
    shm_size: 1gb # browsers crash on Docker's 64 MB default
    volumes: # read-write: the live test writes web/hls/live-e2e and removes it after
      - ./web/hls:/src/web/hls
      - ./web/catalog:/src/web/catalog:ro # the ?core=1 page's default MP4
    depends_on:
      media: { condition: service_completed_successfully }
    profiles: [e2e]
