default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "commit-msg"]

# General hooks (builtin via pre-commit-hooks)
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  # fixtures/ holds binary MPEG-TS, which identify tags as TypeScript text by
  # its .ts extension, so the hooks that rewrite files would corrupt it.
  { id = "trailing-whitespace", exclude = "^fixtures/" },
  { id = "end-of-file-fixer", exclude = "^fixtures/" },
  { id = "mixed-line-ending", exclude = "^fixtures/" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
]

# Python (the e2e suite) and shell; prek installs these pinned versions itself. ruff's default
# rules change between versions, so its rev is the rule set. No ruff format: like cargo fmt, it
# would rewrite the long lines.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.0"
hooks = [{ id = "ruff-check" }]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [{ id = "shellcheck" }]

# The tools on PATH: cargo, hadolint, docker.
[[repos]]
repo = "local"

# Rust. No cargo fmt: the code keeps lines longer than rustfmt's default width.
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets --all-features -- -D warnings"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-check"
name = "cargo check"
language = "system"
entry = "cargo check --all-targets"
types = ["rust"]
pass_filenames = false

# Docker. .hadolint.yaml says which rules are off and why.
[[repos.hooks]]
id = "hadolint"
name = "hadolint"
language = "system"
entry = "hadolint"
types = ["dockerfile"]

[[repos.hooks]]
id = "compose-config"
name = "docker compose config"
language = "system"
entry = "docker compose config -q"
files = "^compose\\.yaml$"
pass_filenames = false

# Commit messages: a conventional commit subject, or one git writes itself (merge, revert, fixup).
[[repos.hooks]]
id = "conventional-commit"
name = "commit subject is type(scope): subject"
language = "pygrep"
entry = '\A(?:(?:feat|fix|refactor|perf|test|build|ci|chore|docs|style|revert)(?:\([\w./-]+\))?!?: \S|Merge |Revert "|(?:fixup|squash|amend)! )'
args = ["--multiline", "--negate"]
stages = ["commit-msg"]
