default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "commit-msg"]

# General hooks (builtin via pre-commit-hooks)
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  # fixtures/ holds binary MPEG-TS, which identify tags as TypeScript text by
  # its .ts extension, so the two hooks that rewrite files would corrupt it.
  { id = "trailing-whitespace", exclude = "^fixtures/" },
  { id = "end-of-file-fixer", exclude = "^fixtures/" },
  { id = "mixed-line-ending", exclude = "^fixtures/" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
]

# Rust. No cargo fmt: the code keeps lines longer than rustfmt's default width.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets --all-features -- -D warnings"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-check"
name = "cargo check"
language = "system"
entry = "cargo check --all-targets"
types = ["rust"]
pass_filenames = false

# Shell and Python (the e2e suite). No ruff format: like cargo fmt, it would rewrite the long lines.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
entry = "shellcheck"
types = ["shell"]

[[repos.hooks]]
id = "ruff"
name = "ruff check"
language = "system"
entry = "ruff check"
types = ["python"]

# Docker. hadolint uses the binary on PATH; .hadolint.yaml says which rules are off and why.
[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.12.0"
hooks = [{ id = "hadolint" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "compose-config"
name = "docker compose config"
language = "system"
entry = "docker compose config -q"
files = "^compose\\.yaml$"
pass_filenames = false

# Commit messages: a conventional commit subject, or one git writes itself (merge, revert, fixup).
[[repos]]
repo = "local"

[[repos.hooks]]
id = "conventional-commit"
name = "commit subject is type(scope): subject"
language = "pygrep"
entry = '\A(?:(?:feat|fix|refactor|perf|test|build|ci|chore|docs|style|revert)(?:\([\w./-]+\))?!?: \S|Merge |Revert "|(?:fixup|squash|amend)! )'
args = ["--multiline", "--negate"]
stages = ["commit-msg"]
